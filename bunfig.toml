# Supply-chain cooldown. A dependency version must have been on the registry for at least this long
# before we will install it — the window in which a compromised release is typically caught and
# unpublished. It applies to fresh resolutions (`bun add`, `bun update`, an unlocked install), not to
# `--frozen-lockfile`, which installs exactly what the lockfile already pins.
#
# Bun does NOT read npm's `min-release-age` from .npmrc; this file is what actually enforces it here,
# and `web/bunfig.toml` carries the same setting because web/ has its own lockfile and is installed
# from its own directory. Keep the two in sync.
[install]
minimumReleaseAge = 604800 # 7 days, in seconds
# remix@3.0.0 and its 48 @remix-run/* dependencies were published 2026-10-01, inside the 7-day
# window. The bridge's HTTP dispatch runs on remix/router (remix-v3 branch), so exactly those 49
# names are exempt; the gate stays on for every other package. The window clears on 2026-10-08,
# after which this list can go.
minimumReleaseAgeExcludes = [
  "remix",
  "@remix-run/fs",
  "@remix-run/cli",
  "@remix-run/spa",
  "@remix-run/auth",
  "@remix-run/mime",
  "@remix-run/test",
  "@remix-run/assert",
  "@remix-run/assets",
  "@remix-run/cookie",
  "@remix-run/headers",
  "@remix-run/session",
  "@remix-run/node-hmr",
  "@remix-run/node-tsx",
  "@remix-run/response",
  "@remix-run/terminal",
  "@remix-run/component",
  "@remix-run/lazy-file",
  "@remix-run/data-table",
  "@remix-run/tar-parser",
  "@remix-run/data-schema",
  "@remix-run/fetch-proxy",
  "@remix-run/fetch-router",
  "@remix-run/file-storage",
  "@remix-run/component-hmr",
  "@remix-run/html-template",
  "@remix-run/route-pattern",
  "@remix-run/cop-middleware",
  "@remix-run/auth-middleware",
  "@remix-run/cors-middleware",
  "@remix-run/csrf-middleware",
  "@remix-run/file-storage-s3",
  "@remix-run/data-table-mysql",
  "@remix-run/form-data-parser",
  "@remix-run/multipart-parser",
  "@remix-run/data-table-sqlite",
  "@remix-run/logger-middleware",
  "@remix-run/node-fetch-server",
  "@remix-run/render-middleware",
  "@remix-run/static-middleware",
  "@remix-run/session-middleware",
  "@remix-run/data-table-postgres",
  "@remix-run/form-data-middleware",
  "@remix-run/session-storage-redis",
  "@remix-run/compression-middleware",
  "@remix-run/async-context-middleware",
  "@remix-run/session-storage-memcache",
  "@remix-run/method-override-middleware",
  "@remix-run/multiple-import-maps-polyfill",
]
