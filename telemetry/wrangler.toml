# The install-count receiver (M86 spec 04). Nothing here is deployed by the repo.
# No account id and no secret live in this file; wrangler reads the account from your login.
name = "collie-ping"
main = "worker.ts"
compatibility_date = "2026-11-01"

# Only the custom domain below serves the worker, never a *.workers.dev name.
workers_dev = false

# The Worker keeps no log of requests. Turn this on only to debug, and then off again.
[observability]
enabled = false

[[routes]]
pattern = "ping.colliepwa.dev"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "collie-ping"
# Replace with the id that `wrangler d1 create collie-ping` prints.
database_id = "your-database-id"

# Daily prune of rows older than 400 days, at 03:17 UTC.
[triggers]
crons = ["17 3 * * *"]
