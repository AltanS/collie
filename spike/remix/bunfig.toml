# SPIKE ONLY. Not for web/ or the checkout root.
# The root bunfig.toml enforces a 7-day minimumReleaseAge. remix@3.0.0 and all 48 of its
# @remix-run/* dependencies were published 2026-10-01, so the root gate rejects them:
#   error: No version matching "remix" found for specifier "3.0.0"
#   (blocked by minimum-release-age: 604800 seconds)
# This file keeps the 7-day gate for every other package and exempts only the Remix family.
# Probe 5 adds @remix-run/ui (0.12.1, published 2026-10-01) for the animation mixins.
[install]
minimumReleaseAge = 604800
minimumReleaseAgeExcludes = [
  "remix",
  "@remix-run/ui",
  "@remix-run/fs",
  "@remix-run/cli",
  "@remix-run/spa",
  "@remix-run/auth",
  "@remix-run/mime",
  "@remix-run/test",
  "@remix-run/assert",
  "@remix-run/assets",
  "@remix-run/cookie",
  "@remix-run/headers",
  "@remix-run/session",
  "@remix-run/node-hmr",
  "@remix-run/node-tsx",
  "@remix-run/response",
  "@remix-run/terminal",
  "@remix-run/component",
  "@remix-run/lazy-file",
  "@remix-run/data-table",
  "@remix-run/tar-parser",
  "@remix-run/data-schema",
  "@remix-run/fetch-proxy",
  "@remix-run/fetch-router",
  "@remix-run/file-storage",
  "@remix-run/component-hmr",
  "@remix-run/html-template",
  "@remix-run/route-pattern",
  "@remix-run/cop-middleware",
  "@remix-run/auth-middleware",
  "@remix-run/cors-middleware",
  "@remix-run/csrf-middleware",
  "@remix-run/file-storage-s3",
  "@remix-run/data-table-mysql",
  "@remix-run/form-data-parser",
  "@remix-run/multipart-parser",
  "@remix-run/data-table-sqlite",
  "@remix-run/logger-middleware",
  "@remix-run/node-fetch-server",
  "@remix-run/render-middleware",
  "@remix-run/static-middleware",
  "@remix-run/session-middleware",
  "@remix-run/data-table-postgres",
  "@remix-run/form-data-middleware",
  "@remix-run/session-storage-redis",
  "@remix-run/compression-middleware",
  "@remix-run/async-context-middleware",
  "@remix-run/session-storage-memcache",
  "@remix-run/method-override-middleware",
  "@remix-run/multiple-import-maps-polyfill",
]
