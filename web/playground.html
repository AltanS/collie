<!doctype html>
<!-- DEV-ONLY states playground. It is NOT part of the production bundle: Vite's default
     `build.rollupOptions.input` is the root `index.html` alone, so `vite build` never sees this file
     and the PWA precache manifest (built from `dist`) can never list it. `src/playground/
     playground-entry.test.ts` pins that. Reach it at http://<host>:<port>/playground.html while
     `vite dev` is running. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Same first-paint theme pin the real app uses, so the playground reads the operator's own
         light/dark choice out of the same localStorage key. -->
    <script src="/theme-init.js"></script>
    <title>Collie — states playground</title>
    <!-- The playground's own red icon set (web/vite-icons.ts's PLAYGROUND_ICON_LINKS), linked
         directly rather than through the channel plugin: the playground has no manifest and no
         service worker (see the file header above), so there is no per-channel branch to run —
         these three tags are the whole story, on every serve. -->
    <link rel="icon" type="image/svg+xml" href="/favicon-playground.svg" />
    <link rel="shortcut icon" href="/favicon-playground.ico" />
    <link rel="icon" type="image/png" href="/favicon-playground-96x96.png" sizes="96x96" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/playground/main.tsx"></script>
  </body>
</html>
