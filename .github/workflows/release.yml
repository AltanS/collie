name: Release

# Every pushed vX.Y.Z tag becomes a GitHub Release carrying, for each supported platform, a tarball
# of `bin/collie` + `web/dist` + the files the bridge reads at boot; a per-release integrity manifest
# listing every asset and its sha256; and a `.sha256` sidecar beside every one of them so a user can
# verify a download by hand with `sha256sum -c`. The in-app update banner links here, and
# `scripts/install.sh` and `collie update`'s binary path both read these assets — over constructed
# URLs only, so nothing here may ever emit a download URL into a document (M14/01 §2.1).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the release

jobs:
  # ── CI must be green first ─────────────────────────────────────────────────
  # 1.5.5 (2026-09-07) was published from a commit whose CI run had FAILED: the tag push started
  # this workflow while ci.yml ran the same commit in its own workflow, and nothing joined the two.
  # This job is that join. "Publish" may never precede "green".
  gate:
    name: CI must be green on the tagged commit
    runs-on: ubuntu-latest
    # The workflow's top-level grant is `contents: write` and an unlisted scope is NONE, so the run
    # listing below would 403 without `actions: read` spelled here.
    permissions:
      actions: read
      contents: read
    steps:
      # No checkout: the question is about a commit on the server, not about a working tree. For a
      # tag push `github.sha` is the commit the tag points at, which is the commit CI ran on.
      - name: Wait for the CI run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The commit is RESOLVED, not assumed: for an annotated tag the push event can carry the
          # tag object rather than the commit it points at, and `github.sha` is then the wrong id to
          # look CI up by. The commits endpoint takes a tag name and answers with the commit.
          if ! SHA="$(gh api "repos/$REPO/commits/$TAG" --jq .sha 2>/dev/null)" || [ -z "$SHA" ]; then
            echo "✗ tag $TAG does not resolve to a commit in $REPO." >&2
            exit 1
          fi
          echo "Tag $TAG points at commit $SHA."

          # `git push --follow-tags` sends main and the tag in one push, so CI is normally still
          # running when this starts. Waiting is the design: the release queues behind CI rather
          # than racing it. 40 minutes is well past a full CI run and well short of a stuck one.
          wait_seconds=2400
          poll_seconds=30
          # A run takes a few seconds to be registered after a push, so an empty listing is only
          # believed after this much silence — long enough to outlive the race, short enough that a
          # tag pointing at a commit main never saw fails while the operator is still watching.
          grace_seconds=120

          started="$(date +%s)"
          while :; do
            # `event=push` only: CI runs the push event on main, and a pull_request run for the
            # same head sha tests a merge ref, so it does not prove main.
            runs="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&per_page=20")"
            total="$(jq '.workflow_runs | length' <<<"$runs")"
            success="$(jq '[.workflow_runs[] | select(.conclusion == "success")] | length' <<<"$runs")"
            pending="$(jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting")] | length' <<<"$runs")"
            elapsed="$(( $(date +%s) - started ))"

            if [ "$success" -gt 0 ]; then
              echo "CI is green on $SHA."
              jq -r '.workflow_runs[] | select(.conclusion == "success") | "  \(.html_url)"' <<<"$runs"
              exit 0
            fi

            if [ "$total" -eq 0 ] && [ "$elapsed" -lt "$grace_seconds" ]; then
              echo "No CI run registered for $SHA yet; waiting (${elapsed}s)."
              sleep "$poll_seconds"; continue
            fi

            if [ "$total" -eq 0 ]; then
              cat >&2 <<EOF
          ✗ CI never ran on $SHA, so nothing proves this commit is releasable.
            Either the tag does not point at a commit that was pushed to main, or CI was never
            triggered on it. Push the commit to main first, let CI finish, then re-run this workflow:
            $RUN_URL
          EOF
              exit 1
            fi

            if [ "$pending" -gt 0 ]; then
              echo "CI is still running on $SHA (${pending} run(s) in flight, ${elapsed}s elapsed)."
              if [ "$elapsed" -ge "$wait_seconds" ]; then
                echo "✗ CI on $SHA did not finish within $((wait_seconds / 60)) minutes." >&2
                jq -r '.workflow_runs[] | "  \(.status) \(.conclusion // "-") \(.html_url)"' <<<"$runs" >&2
                exit 1
              fi
              sleep "$poll_seconds"; continue
            fi

            # Completed, and not one of them succeeded. The two ways to get here need two different
            # answers, so name both rather than print a verdict the operator has to interpret.
            latest_conclusion="$(jq -r '[.workflow_runs[] | select(.status == "completed")] | sort_by(.run_started_at) | last | .conclusion // "unknown"' <<<"$runs")"
            latest_id="$(jq -r '[.workflow_runs[] | select(.status == "completed")] | sort_by(.run_started_at) | last | .id' <<<"$runs")"
            {
              echo "✗ CI on $SHA concluded '$latest_conclusion'. This release is not published."
              jq -r '.workflow_runs[] | "  \(.conclusion // .status) \(.html_url)"' <<<"$runs"
              echo "  cancelled: ci.yml's concurrency group cancels the main run when a second push lands while a release is being cut. Re-run CI for this commit with 'gh run rerun $latest_id', then re-run this Release workflow from $RUN_URL."
              echo "  failure: fix it on main and cut a follow-up patch release with a new tag. Never move or re-point a published tag."
            } >&2
            exit 1
          done

  # ── The per-platform payloads ──────────────────────────────────────────────
  # One job per artifact, because two of the constraints are hard:
  #   * macOS artifacts are BUILT ON macOS. A cross-produced Mach-O is unsigned, and an unsigned
  #     arm64 binary does not execute on Apple Silicon at all — the kernel refuses it.
  #   * linux-x64 ships Bun's BASELINE target. The default `bun-linux-x64` requires AVX2 and dies
  #     with SIGILL on older hardware, which is exactly the hardware a self-hosted tool lives on.
  #     Collie is I/O-bound (a Unix socket and static files), so the baseline penalty is not
  #     observable here.
  # The matrix is written for the full four-target set and SHIPS three; a user on a fast-follow
  # platform gets `collie update`'s honest "no artifact for your platform, build from source"
  # rather than a wrong binary. Uncomment a row to publish it.
  payload:
    needs: gate
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x64
            runs-on: ubuntu-latest
            bun-target: bun-linux-x64-baseline
          - platform: macos-arm64
            runs-on: macos-14
            bun-target: bun-darwin-arm64
          - platform: linux-arm64
            runs-on: ubuntu-24.04-arm
            bun-target: bun-linux-arm64
          # - platform: macos-x64
          #   runs-on: macos-13
          #   bun-target: bun-darwin-x64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      # The build environment is `flake.nix`, not whatever Bun a setup action resolved on the day.
      # This installer is the one that covers all three shipped runners — Linux x86_64, Linux
      # aarch64 and macOS aarch64 — and it turns flakes on out of the box.
      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Build the payload
        env:
          PLATFORM: ${{ matrix.platform }}
          BUN_TARGET: ${{ matrix.bun-target }}
        run: |
          set -eu
          # The build body below is unchanged, and it runs under `nix develop` — so `bun`, `node`,
          # `git`, `tmux` and `zellij` are the versions `flake.lock` names, on every runner, rather
          # than whatever the machine happened to carry. It is written to a file rather than piped,
          # so nothing competes for the shell's stdin, and it keeps its own `set -eu`.
          cat > "$RUNNER_TEMP/build-payload.sh" <<'PAYLOAD'
          set -eu
          version="${GITHUB_REF_NAME#v}"
          root="collie-$version-$PLATFORM"
          stage="$RUNNER_TEMP/$root"
          mkdir -p "$stage/bin" "$stage/web"

          # The version gate `collie build` runs, run here too: a release whose four version files
          # disagree must not become a downloadable artifact.
          bash scripts/check-version.sh

          bun install --frozen-lockfile
          (cd web && bun install --frozen-lockfile && bun run build)

          # NO LINT STEP, here or anywhere on an operator's path: oxlint's allocator SIGABRTs below
          # roughly 7 GB of RAM and bricked real installs (1.0.0-beta.44). CI lints in its own
          # workflow, over the full tree, which is the only run that defines "passing".
          # THE COMPILE RUNS ON THE UPSTREAM BUN, not on the one this shell just used, because
          # `bun build --compile` copies the RUNNING bun as the base of what it emits and nixpkgs
          # patches its own copy into the Nix store (#184). scripts/upstream-bun.sh realises the
          # archive `flake.nix` pins and prints its bun; its header carries the whole argument.
          upstream_bun="$(FLAKE_ROOT="$GITHUB_WORKSPACE" bash scripts/upstream-bun.sh)"
          "$upstream_bun" build --compile --target="$BUN_TARGET" ./cli/main.ts --outfile "$stage/bin/collie"
          chmod 0755 "$stage/bin/collie"

          # Ad-hoc codesign makes the binary RUNNABLE on Apple Silicon. It makes no claim about who
          # produced it — notarization is a recorded gap (M14/01 §6.2), and the quarantine attribute
          # a BROWSER download sets is documented in docs/install.md with its one-line removal.
          case "$PLATFORM" in
            macos-*)
              codesign --force --sign - --timestamp=none "$stage/bin/collie"
              codesign -dv "$stage/bin/collie"
              ;;
          esac

          cp -R web/dist "$stage/web/dist"
          # The files the bridge and the installer's closing text read at run time. `herdr-plugin.toml`
          # is bridge/root.ts's MARKER and the canonical version; `package.json` is what
          # bridge/index.ts reads `currentVersion` from — without it the bridge crashes at boot.
          cp herdr-plugin.toml package.json .env.example CHANGELOG.md LICENSE README.md "$stage/"
          cp -R docs "$stage/docs"
          # The shim the MANIFEST names. Every `[[actions]]` entry in `herdr-plugin.toml` is frozen
          # byte-for-byte as `bash scripts/collie-ctl.sh <verb>` (ADR 0006), so a payload that carries
          # the manifest without the shim hands Herdr a set of action buttons that cannot resolve —
          # which is exactly what an OS package built from this tarball would install. Only the shim
          # is needed: it resolves nothing here and `exec`s `bin/collie`, which is already in $stage.
          mkdir -p "$stage/scripts"
          cp scripts/collie-ctl.sh "$stage/scripts/collie-ctl.sh"
          chmod 0755 "$stage/scripts/collie-ctl.sh"

          PAYLOAD
          nix develop --command bash "$RUNNER_TEMP/build-payload.sh"

      # OUTSIDE `nix develop`, and that is the whole point of it being its own step. Everything
      # above ran inside the flake, and the bun derivation's own install check runs inside Nix too,
      # so neither can see a link into the build machine's store. Nor can simply STARTING the binary
      # here: nix-installer-action left a /nix/store on this runner, so a binary that only runs
      # because that store exists runs perfectly. The loader check is the guard; the version run
      # after it only proves the binary that passed the check is the binary that works (#184).
      #
      # The tarball is sealed HERE rather than in the build, because a tarball is what an operator
      # downloads: it must not exist before the binary inside it has been checked.
      - name: Check the binary an operator gets, then seal the tarball
        # The id must stay `build`: "Describe the artifact" below reads this step's outputs.
        id: build
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # Recomputed from the same two facts the build body used, rather than carried across: the
          # tag and the matrix platform are both already in this step's environment.
          version="${GITHUB_REF_NAME#v}"
          root="collie-$version-$PLATFORM"
          stage="$RUNNER_TEMP/$root"

          bash scripts/check-payload-links.sh "$stage/bin/collie"

          reported="$("$stage/bin/collie" version)"
          case "$reported" in
            "$version"*) ;;
            *) echo "the compiled binary reports '$reported', which does not start with '$version'" >&2; exit 1 ;;
          esac
          echo "✓ $root/bin/collie reports $reported"

          # The only step in CI that runs the compiled binary, so it is also the only place the
          # embedded manual can be proven: `docs crew` prints a page nothing on disk supplied.
          page="$("$stage/bin/collie" docs crew | head -1)"
          if [ "$page" != "# Crew commands" ]; then
            echo "the compiled binary answered 'docs crew' with '$page', not the embedded page" >&2
            exit 1
          fi
          echo "✓ $root/bin/collie carries the embedded operator docs"

          tar -czf "$RUNNER_TEMP/$root.tar.gz" -C "$RUNNER_TEMP" "$root"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "tarball=$RUNNER_TEMP/$root.tar.gz" >> "$GITHUB_OUTPUT"

      # `steps.build` is the sealing step above, not the build body — the tarball is an output of
      # the step that made it, so that id may not move.
      - name: Describe the artifact
        env:
          PLATFORM: ${{ matrix.platform }}
          BUN_TARGET: ${{ matrix.bun-target }}
          TARBALL: ${{ steps.build.outputs.tarball }}
          PAYLOAD_ROOT: ${{ steps.build.outputs.root }}
        run: |
          set -eu
          # One entry of the manifest's `artifacts[]`, emitted per platform and merged in the release
          # job. The hasher is resolved rather than assumed: Linux runners have `sha256sum`, macOS
          # has `shasum`, and a missing one must FAIL here — a pipeline into `cut` would hide it and
          # publish a manifest with an empty digest.
          if command -v sha256sum >/dev/null 2>&1; then SHA="sha256sum"; else SHA="shasum -a 256"; fi
          line="$($SHA "$TARBALL")"
          sha="${line%% *}"
          [ ${#sha} -eq 64 ] || { echo "no usable sha256 tool on this runner" >&2; exit 1; }
          size="$(wc -c < "$TARBALL" | tr -d ' ')"
          name="$(basename "$TARBALL")"
          os="${PLATFORM%-*}"; arch="${PLATFORM##*-}"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$TARBALL" "$RUNNER_TEMP/out/$name"
          printf '%s  %s\n' "$sha" "$name" > "$RUNNER_TEMP/out/$name.sha256"
          case "$os" in
            linux) libc='"glibc"'; variant='"baseline"'; extra='' ;;
            *)     libc='null';    variant='null';       extra=', "codesign": "adhoc", "notarized": false' ;;
          esac
          cat > "$RUNNER_TEMP/out/$PLATFORM.artifact.json" <<JSON
          {
            "name": "$name",
            "platform": "$PLATFORM",
            "os": "$os",
            "arch": "$arch",
            "libc": $libc,
            "variant": $variant,
            "bunTarget": "$BUN_TARGET",
            "size": $size,
            "sha256": "$sha",
            "payloadRoot": "$PAYLOAD_ROOT"$extra
          }
          JSON

      - uses: actions/upload-artifact@v4
        with:
          name: payload-${{ matrix.platform }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 1

  # ── The release ────────────────────────────────────────────────────────────
  release:
    needs: payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release notes carry a compare link against the PREVIOUS tag, and the step below
          # asks git for it with `git describe --tags`. A default checkout is one commit deep and
          # carries no tags at all, so `describe` would answer nothing and the compare line would
          # silently disappear from every release page. Full depth is the cheap fix: this job is
          # not the one that builds the payloads.
          fetch-depth: 0
      # The same flake as the payload job, for the same reason: this job builds the `web/dist`
      # asset the demo runs, and reads the manifest back with Bun.
      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: actions/download-artifact@v4
        with:
          pattern: payload-*
          merge-multiple: true
          path: ${{ runner.temp }}/assets

      # The built frontend, published as an asset. It is what colliepwa.dev's demo runs: a pinned
      # release bundle whose network calls are answered in the browser, so the demo shows the real
      # app without this repo carrying a line of demo code. Collie itself never consumes it — a
      # binary install gets `web/dist` inside its own payload — and it is listed under the manifest's
      # `extras`, not its `artifacts`, for exactly that reason.
      - name: Build and package web/dist
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          nix develop --command bash -c "cd web && bun install --frozen-lockfile && bun run build"
          tar -czf "$RUNNER_TEMP/assets/web-dist-$version.tar.gz" -C web dist

      - name: Write the integrity manifest
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cd "$RUNNER_TEMP/assets"
          # `prerelease` follows the tag's own hyphen, the same rule `gh release create` is given
          # below — one fact, spelled twice, never derived two ways.
          prerelease=false
          case "$GITHUB_REF_NAME" in *-*) prerelease=true ;; esac
          {
            printf '{\n'
            printf '  "schemaVersion": 1,\n'
            printf '  "repo": "%s",\n' "$GITHUB_REPOSITORY"
            printf '  "tag": "%s",\n' "$GITHUB_REF_NAME"
            printf '  "version": "%s",\n' "$version"
            printf '  "prerelease": %s,\n' "$prerelease"
            printf '  "releasedAt": "%s",\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '  "commit": "%s",\n' "$GITHUB_SHA"
            printf '  "artifacts": [\n'
            first=1
            for f in *.artifact.json; do
              [ "$first" -eq 1 ] || printf ',\n'
              first=0
              sed 's/^/    /' "$f"
            done
            printf '\n  ],\n'
            printf '  "extras": [\n'
            printf '    {\n'
            printf '      "name": "web-dist-%s.tar.gz",\n' "$version"
            printf '      "role": "web-bundle",\n'
            printf '      "size": %s,\n' "$(wc -c < "web-dist-$version.tar.gz" | tr -d ' ')"
            printf '      "sha256": "%s"\n' "$(sha256sum "web-dist-$version.tar.gz" | cut -d' ' -f1)"
            printf '    }\n'
            printf '  ]\n'
            printf '}\n'
          } > "collie-$version.manifest.json"
          rm -f ./*.artifact.json
          # Machine-readable proof that the document we just wrote is JSON, before anyone downloads
          # it: a manifest that does not parse fails the release, not the operator's update.
          # This step's cwd is $RUNNER_TEMP/assets, outside the checkout, so the flake must be
          # named by path — `nix develop` alone finds no flake.nix above the assets directory.
          nix develop "$GITHUB_WORKSPACE" --command bun -e 'JSON.parse(await Bun.file(process.argv[1]).text())' "collie-$version.manifest.json"
          # A sidecar beside EVERY asset, including the manifest — `sha256sum -c <asset>.sha256` on
          # Linux, `shasum -a 256 -c` on macOS, both unmodified.
          for f in *.tar.gz *.manifest.json; do
            [ -e "$f.sha256" ] || sha256sum "$f" > "$f.sha256"
          done
          ls -l

      # ── What this release says about itself (M27/06) ──────────────────────
      # One tiny asset, `collie-release.json`, carrying the version and the CREW WIRE VERSION this
      # release speaks. The update check on an installed Collie reads it and can then tell an
      # operator, BEFORE they confirm, that the update changes the link their crew talks over.
      # Generic by construction: the notice is about a NUMBER, so the release after the next one
      # says it too with no code change.
      #
      # THE NUMBER IS EVALUATED, NEVER TRANSCRIBED. `bun` imports the same module the binary
      # compiles, so the asset cannot drift from the build: there is no second copy of the constant
      # anywhere. A missing or non-integer value fails the release here, before anything is
      # published, rather than shipping a document an install would silently discard.
      - name: Write the release reading
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          protocol="$(nix develop --command bun -e 'import { CREW_PROTOCOL_VERSION } from "./bridge/crew/enrollment.ts"; process.stdout.write(String(CREW_PROTOCOL_VERSION))')"
          case "$protocol" in
            ''|*[!0-9]*)
              echo "error: CREW_PROTOCOL_VERSION did not read as an integer: '$protocol'" >&2
              exit 1
              ;;
          esac
          printf '{\n  "version": "%s",\n  "crewProtocol": %s\n}\n' "$version" "$protocol" \
            > "$RUNNER_TEMP/assets/collie-release.json"
          # Proof it parses before anyone downloads it, exactly as the manifest is proved above.
          nix develop --command bun -e 'JSON.parse(await Bun.file(process.argv[1]).text())' \
            "$RUNNER_TEMP/assets/collie-release.json"
          cat "$RUNNER_TEMP/assets/collie-release.json"

      - name: Assemble release notes from CHANGELOG.md
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/notes.md"
          # CHANGELOG.md is the one record of this release's changes, and the page is built from it.
          # The page's order is the reader's: the update commands first and unfolded, because a
          # phone arrives here from the in-app banner to copy one command; then what changed, the
          # leads of that version's bullets under their group headings; then the changelog link and
          # the compare link; then the verify recipe, the one block that is folded. The anchor is
          # the script's job now, so no shell here builds it.
          # `scripts/release-notes.test.ts` pins the shape, over fixtures AND over this repo's own
          # CHANGELOG, so a badly shaped bullet is red in CI long before a tag is pushed.
          #
          # The script exits 1 when the section cannot be read: no heading for this version, a
          # bullet with no bold lead, a bullet above every group heading. There is deliberately no
          # fallback body: the page's content IS that section, so a release published without it
          # would list nothing at all, and the version gate has already required the heading to
          # exist. Fix the CHANGELOG and re-run the workflow.
          #
          # The compare link's other end is a REAL TAG, asked of git, never derived from the
          # CHANGELOG. Betas 33 to 41 were cut in the CHANGELOG and never tagged (CLAUDE.md,
          # *Versioning*), so a heading-derived link would point at a ref that does not exist and
          # 404. `describe` starts at the tagged commit's parent, so it names the tag before this
          # one; an empty answer, which is what the very first release gets, means no compare line.
          prev="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          previous=()
          [ -z "$prev" ] || previous=(--previous-tag "$prev")
          echo "compare base: ${prev:-<none>}"
          # Same flake as every other bun invocation in this workflow, so the notes are produced by
          # the Bun the release is built with.
          nix develop --command bun scripts/release-notes.ts \
            --version "$version" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            "${previous[@]}" > "$notes"
          echo "file=$notes" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub does NOT infer "prerelease" from a semver hyphen — the API defaults to
          # prerelease:false, which also moves the Latest badge. A `-beta` / `-rc` tag must never take
          # that badge from the shipped release line, so mark it explicitly.
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags=(--prerelease) ;; esac
          # No `--generate-notes`. GitHub's generated summary only knows merged pull requests, and
          # most of Collie's history lands as direct commits or as cherry-picks that keep the
          # author, so that list showed a handful of entries under a release that moved twenty
          # things and read as if almost nothing had happened. The compare link was the one part
          # worth keeping, and the notes file now writes it itself.
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "${{ steps.notes.outputs.file }}" \
            "$RUNNER_TEMP"/assets/*

  # ── Tell the website ───────────────────────────────────────────────────────
  # colliepwa.dev quotes this repo's `docs/*.md`, and it quotes them at the latest PUBLISHED release
  # rather than at `main`, because the site documents what a reader can install. This dispatch is
  # what makes that immediate instead of up to a day late; the site polls daily as well, so a
  # missed dispatch heals itself.
  #
  # IT CARRIES THE TAG FOR THE RECORD AND NOTHING ELSE READS IT. Which release the site documents is
  # decided in one place, `resolveRef` in the site's sync-docs.ts, which takes the highest published
  # non-prerelease semver. A tag passed as an instruction would be a second answer to that question.
  #
  # TERMINAL, WITH `needs: release`. The credential is a fine-grained PAT and those expire inside a
  # year; when it does, this 401s. Nothing depends on this job, so the release is already published
  # and downloadable by the time it runs. A marketing site not hearing about a release must never be
  # able to fail one.
  notify-website:
    needs: release
    runs-on: ubuntu-latest
    # A prerelease does not move the site, because the site only ever quotes a released line. Same
    # hyphen rule the release job above uses to set `--prerelease`, so the two cannot drift.
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - name: Ask colliepwa.dev to re-quote the docs
        env:
          GH_TOKEN: ${{ secrets.COLLIE_GITHUB_REPO_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY_OWNER}/collie-website/dispatches" \
            -f event_type=collie-released \
            -f "client_payload[tag]=$GITHUB_REF_NAME"

  # ── Refresh the packages ───────────────────────────────────────────────────
  # `packaging/aur` and `packaging/nix` describe a release: a version and a sha256 per platform.
  # This job rewrites those fields FROM `collie-<version>.manifest.json`, the integrity manifest the
  # release job above wrote, and from nothing else. It downloads no payload, hashes no payload and
  # builds nothing — the release already answered "what is the hash of this tarball", and a second
  # answer computed here could differ from the first.
  #
  # It runs after the tag rather than inside the release commit, because `chore(release): x.y.z`
  # does the version bump "and nothing else" (CLAUDE.md → Versioning), and the manifest it reads
  # does not exist until the release is published.
  #
  # It publishes two ways, and neither one can fail the release, which is already downloadable:
  #   * a push to the AUR repository, skipped with a notice when AUR_SSH_KEY is unset;
  #   * a pull request against this repository carrying the same rewritten files.
  refresh-packages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # A prerelease is skipped. Somebody following `collie-bin` on the AUR did not sign up for a
    # beta. Same hyphen rule the release job uses to set `--prerelease` and notify-website uses to
    # stay home, so the three cannot drift apart.
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      # `main`, not the tag: the pull request this job opens has to branch off the line it targets.
      # The manifest is fetched from the release, so nothing here depends on the tagged tree.
      - uses: actions/checkout@v4
        with:
          ref: main
      # The same flake the payloads were built in, for the same reason: the Bun that runs the
      # rewrite is the one `flake.lock` names, not whatever a setup action resolved today.
      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Download this release's integrity manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" \
            --pattern "collie-$version.manifest.json" \
            --dir "$RUNNER_TEMP"
          echo "MANIFEST=$RUNNER_TEMP/collie-$version.manifest.json" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Rewrite packaging/ from the manifest
        run: nix develop --command bun scripts/refresh-packages.ts --manifest "$MANIFEST"

      # `.SRCINFO` is what the AUR reads, and only `makepkg` knows its format. The runner is Ubuntu,
      # so the generator runs in an Arch container. It copies the PKGBUILD's own values; it computes
      # nothing and reaches no network.
      - name: Regenerate .SRCINFO with makepkg
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/packaging/aur:/pkg:ro" -w /tmp archlinux:latest bash -c '
            set -e
            useradd -m builder
            cp /pkg/PKGBUILD /pkg/collie-bin.install /tmp/
            chown builder /tmp/PKGBUILD /tmp/collie-bin.install
            su builder -c "cd /tmp && makepkg --printsrcinfo"
          ' > packaging/aur/.SRCINFO
          head -5 packaging/aur/.SRCINFO

      # The second run is the proof. It re-reads both files from disk and compares every field it
      # owns against the manifest, so what gets pushed is verified rather than intended.
      - name: Verify packaging/ against the manifest
        run: nix develop --command bun scripts/refresh-packages.ts --manifest "$MANIFEST" --check

      - name: Push collie-bin to the AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_KEY:-}" ]; then
            echo "::notice::AUR push skipped because the AUR_SSH_KEY secret is not set. See packaging/aur/README.md for the one-time account and key setup."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/collie-bin.git "$RUNNER_TEMP/aur"
          # The `.install` travels with the PKGBUILD: `install=collie-bin.install` names it, and an
          # AUR clone without it fails `makepkg` on the missing file.
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO packaging/aur/collie-bin.install "$RUNNER_TEMP/aur/"
          cd "$RUNNER_TEMP/aur"
          git config user.name "Collie release"
          git config user.email "altan@sportsight.de"
          git add PKGBUILD .SRCINFO collie-bin.install
          if git diff --cached --quiet; then
            echo "The AUR already carries $VERSION; nothing to push."
            exit 0
          fi
          git commit -m "Update to $VERSION"
          git push origin HEAD:master

      # The in-repo copy is the source of truth these files are reviewed in, so it gets a pull
      # request rather than a push to `main`. When the tagged commit already carried the right
      # version and hashes, `git diff` is empty and no branch is created.
      - name: Open a pull request with the rewritten package files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- packaging/; then
            echo "packaging/ already matches $VERSION on main; no pull request needed."
            exit 0
          fi
          branch="packaging/$VERSION"
          # An existing branch is somebody's work, or a re-run's. It is never overwritten: a force
          # push here would silently discard a review comment's fix on the same branch name.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::notice::Branch $branch already exists on the remote, so nothing was pushed and no pull request was opened. Check it, and delete it if it is stale."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add packaging/
          git commit -m "chore(packaging): track $VERSION"
          git push origin "$branch"
          if ! gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(packaging): track $VERSION" \
            --body "Version and sha256 fields rewritten from \`collie-$VERSION.manifest.json\` by \`scripts/refresh-packages.ts\`, then verified against it with \`--check\`. No hash was computed here."; then
            # The branch is pushed either way, so the work is not lost. The usual cause is a
            # repository setting rather than anything in this file, and it is named here because a
            # bare "gh pr create failed" sends the next reader looking in the wrong place.
            echo "::notice::Branch $branch was pushed but no pull request could be opened. Open it by hand."
            {
              echo "### Packaging pull request not opened"
              echo
              echo "Branch \`$branch\` is pushed and carries the rewritten \`packaging/\` files."
              echo "\`gh pr create\` failed. The likely cause is the repository setting"
              echo "**Allow GitHub Actions to create and approve pull requests**"
              echo "(Settings → Actions → General → Workflow permissions), which is off by default."
              echo "Turn it on, or open the pull request by hand from that branch."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
