name: Release

# Every pushed vX.Y.Z tag becomes a GitHub Release whose notes carry the update commands — the
# in-app update banner links here, so the page a user lands on tells them exactly how to update.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble release notes (CHANGELOG section + update commands)
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/notes.md"
          # This version's CHANGELOG block: everything between its `## [x.y.z]` heading and the next.
          awk -v ver="$version" '
            $0 ~ ("^## \\[" ver "\\]") { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/changelog.md" || true
          {
            if [ -s "$RUNNER_TEMP/changelog.md" ]; then
              cat "$RUNNER_TEMP/changelog.md"
              echo
            fi
            echo "## Update"
            echo
            echo "Update the plugin — advances the checkout, rebuilds, restarts (runs from any directory):"
            echo
            echo '```'
            echo "herdr plugin action invoke update --plugin herdr.collie"
            echo '```'
            echo
            echo "Or just restart the bridge to pick up an already-built change:"
            echo
            echo '```'
            echo "herdr plugin action invoke restart --plugin herdr.collie"
            echo '```'
          } > "$notes"
          echo "file=$notes" >> "$GITHUB_OUTPUT"

      # The built frontend, published as an asset. It is what colliepwa.dev's demo runs: a pinned
      # release bundle whose network calls are answered in the browser, so the demo shows the real
      # app without this repo carrying a line of demo code. Nothing in Collie consumes it, and an
      # operator never downloads it — `collie build` still builds web/ from source on the host.
      - uses: oven-sh/setup-bun@v2

      - name: Build and package web/dist
        id: bundle
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          (cd web && bun install --frozen-lockfile && bun run build)
          tar -czf "$RUNNER_TEMP/web-dist-$version.tar.gz" -C web dist
          (cd "$RUNNER_TEMP" && sha256sum "web-dist-$version.tar.gz" > "web-dist-$version.tar.gz.sha256")
          echo "tarball=$RUNNER_TEMP/web-dist-$version.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=$RUNNER_TEMP/web-dist-$version.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Collie $GITHUB_REF_NAME" \
            --notes-file "${{ steps.notes.outputs.file }}" \
            "${{ steps.bundle.outputs.tarball }}" \
            "${{ steps.bundle.outputs.checksum }}"
