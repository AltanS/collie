name: CI

# WHEN EACH PART RUNS. Every push and pull request runs `check`, `web tests`, `crew drill`, the
# Chromium browser job and `quarantine`. Four parts are slower or older than a push needs, and wake
# only when their paths change (`scripts/ci-changes.ts`, the lists in `scripts/test-sets.ts`):
#   - the frozen tests inside `check` and `web tests` (the plugin data path, the browser-leg rig, the
#     harness lab): a path change runs them, a change elsewhere leaves them out;
#   - `bun-floor`, `durable-example` and `e2e-swap`: whole jobs.
# A NIGHTLY run (`schedule`, on `main`) and a manual dispatch run every part, whatever changed.
# A job that does not wake is SKIPPED, not removed, and a skipped job reports as passed, so a check
# that branch protection names never hangs. `release.yml` reads only the `push` run of the release
# commit, and the nightly run has its own concurrency group, so it never cancels that run.
on:
  pull_request:
  push:
    branches: [main, "release-*"]
  schedule:
    - cron: "15 2 * * *" # 02:15 UTC, on the default branch
  workflow_dispatch:

# A new push to a PR supersedes the old run — don't burn a runner on the stale one. A push run is
# NEVER cancelled: the `changes` job diffs `before..head` of its own push, so a cancelled push run
# would take its changed paths with it, and no path-gated job would wake for them before the nightly
# run. The event is in the group so a nightly run on `main` never cancels the push run of a release
# commit.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which of the heavy parts does this run need? About 15 s. The reading is `scripts/ci-changes.ts`;
  # it fails open: when the changed files cannot be worked out, every part runs.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      frozen: ${{ steps.paths.outputs.frozen }}
      bun_floor: ${{ steps.paths.outputs.bun_floor }}
      durable: ${{ steps.paths.outputs.durable }}
      swap: ${{ steps.paths.outputs.swap }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Which parts changed
        id: paths
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/ci-changes.ts

  # Lint, both typechecks, the backend suite and the corpus checks. The web suite is NOT here any
  # more (see `web-tests` below). Measured 2026-10-17 on run 39063808818, this job took 644 s and
  # `Test (web)` alone was 519 s of it (465 files, 31.7k tests on a 4-core runner), so every
  # developer waited on one runner for a suite that splits cleanly. It was the slowest job of the run.
  check:
    name: typecheck + tests
    needs: changes
    runs-on: ubuntu-latest
    # bridge/walky/line-shells.test.ts feeds the typed WalkyTalky line to real shells, and leaves out a
    # shell a machine lacks. Here it must not: with this set, a missing bash, dash, zsh or fish fails
    # the test. Only this job sets it (release, windows, webkit and packaging runs set CI, not this).
    env:
      COLLIE_REQUIRE_SHELLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      # The MANDATORY invariant: the three version files + the newest CHANGELOG heading must agree.
      - name: Version consistency
        run: bash scripts/check-version.sh

      - name: Install (root)
        run: bun install --frozen-lockfile

      # Lint as early as it can actually run: oxlint lives in the ROOT node_modules, so the root
      # install has to come first — but nothing else does. It reads the one `.oxlintrc.json` at the
      # root (which already covers web/src, hence no second run after the web install) with no flags
      # of its own, exactly like the pre-commit hook and `collie build`. Cheap (<1s over the whole
      # tree) and placed before the typechecks and tests so a lint failure doesn't burn minutes on a
      # doomed run. This full-tree run is the authority when a narrower surface disagrees.
      - name: Lint
        run: bun run lint

      - name: Typecheck (root)
        run: bun run typecheck
      # bash and dash ship with the runner; the shell test needs zsh and fish too.
      - name: Install the shells the line test runs (zsh, fish)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends zsh fish
      # `--skip-frozen` leaves out the frozen tests (scripts/test-sets.ts) unless a path of theirs changed;
      # the nightly run and a manual run keep them in.
      - name: Test (bridge)
        run: bun scripts/test.ts ${{ needs.changes.outputs.frozen != 'true' && '--skip-frozen' || '' }}

      - name: Install (web)
        run: cd web && bun install --frozen-lockfile
      - name: Typecheck (web)
        run: cd web && bun run typecheck
      # The corpus rule (M56 spec 10). The web suite (the `web-tests` shards) already runs this file.
      # This step gives the rule its own name in the run log, so a negative trace that reads `free`
      # is easy to find.
      - name: Corpus rule (golden traces, the negative set never reads free)
        run: cd web && bunx vitest run src/lib/surface/traces.test.ts
      - name: Corpus table (every dialog fixture is not free)
        run: bun scripts/surface-corpus.ts

  # The web suite (vitest), in three shards. It left `check` on 2026-10-17: 519 s of that job's 644 s
  # on run 39063808818 was this one step. `--shard=N/3` splits by file, so the three runners each
  # take about a third of the 465 files. No `needs`, like every job here, so a failure reports in the
  # same run as a lint failure. It installs only `web/`: the suite imports a few files from `bridge/`
  # and reads fixtures from the checkout, but nothing it needs lives in the root `node_modules`.
  # `fail-fast: false` so one red shard does not cancel the other two and hide a second failure.
  # The cost is three runners for about a third of the wall clock each; nothing repeats, a re-run is
  # the operator's call. The corpus rule stays in `check`, which runs `traces.test.ts` on its own.
  web-tests:
    name: web tests (${{ matrix.shard }}/3)
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install (web)
        run: cd web && bun install --frozen-lockfile
      # Without a frozen path changed, only the `logic` and `dom` projects run: the `rig` project is the
      # browser-leg tooling (scripts/test-sets.ts, FROZEN_PATHS).
      - name: Test (web, shard ${{ matrix.shard }}/3)
        run: cd web && bunx vitest run --shard=${{ matrix.shard }}/3 ${{ needs.changes.outputs.frozen != 'true' && '--project logic --project dom' || '' }}

  # The two-instance crew drill (integration/crew-harness.test.ts). ITS OWN JOB, and no `needs`, for
  # the same two reasons the browser tier has one. It is slow for a reason nothing can trim: it boots
  # twenty real child processes over real pinned TLS, because a certificate cannot be re-pinned on a
  # reload. Measured 2026-09-30, it was 58.3s of the 67.0s `check` spent on the backend, paid by every
  # developer on every push. Out here it costs wall clock nobody waits on, and a failure still lands
  # in the same run as a lint failure rather than behind it.
  crew:
    name: crew drill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install (root)
        run: bun install --frozen-lockfile
      - name: Crew drill
        run: bun run test:crew

  # The backend suite on the Bun floor (issue 438). `check` runs the newest Bun, so a test that only
  # passes there would never show; MIN_BUN in cli/update-check.ts says the suite passes on the floor,
  # and this job is what measures it. The version is pinned here and scripts/check-flake-bun.test.ts
  # fails when it drifts from MIN_BUN. Its own job and no `needs`, like the crew drill, so a failure
  # lands in the same run as every other one. Backend only: the web suite is Bun-independent (vitest).
  #
  # Wakes on the paths that decide which Bun runs and how (`bunFloor` in scripts/test-sets.ts), and
  # every night. A backend change that only the floor Bun rejects shows in the nightly run.
  bun-floor:
    name: backend tests on the Bun floor
    needs: changes
    if: needs.changes.outputs.bun_floor == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install (root)
        run: bun install --frozen-lockfile
      - name: Test (bridge)
        run: bun test ./bridge
      - name: Test (cli)
        run: bun test ./cli
      - name: Test (scripts)
        run: bun test ./scripts

  # The durable example (M50 spec 10). Its own job: the example is a program with its own lockfile,
  # and Pi Durable never enters the root install. In `check`, bridge/mux/durable/example.test.ts
  # skips for want of that install; here it runs, so the wire, the adapter and the example are proven
  # to agree. Linux only, and never in windows.yml: the example's descendant check needs /proc and
  # SO_PEERCRED, and a Windows socket has no owner for the adapter to check. The Cloudflare example
  # is parked under experiments/ (M55 spec 04) and is in no CI job.
  # Wakes on a change under `examples/`, the SDK package, the durable adapter, and every night.
  durable-example:
    name: durable example
    needs: changes
    if: needs.changes.outputs.durable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install (root)
        run: bun install --frozen-lockfile
      - name: Install (example)
        run: cd examples/durable-member && bun install --frozen-lockfile
      - name: Typecheck (example)
        run: cd examples/durable-member && bun run typecheck
      - name: Test (example)
        run: cd examples/durable-member && bun test
      # The durable-harness entry (M66) is typed and tested against its own example's install: durable-harness and
      # @workflow/* never enter the root install or durable-member's. `sdk:build` below needs it too.
      - name: Install (durable-harness example)
        run: cd examples/durable-harness && bun install --frozen-lockfile
      - name: Typecheck (durable-harness example)
        run: cd examples/durable-harness && bun run typecheck
      # tests/real-harness.test.ts spawns Node to run a real durable-harness session; it needs Node 23.6 or later to
      # run the SDK's TypeScript source, and skips on an older one.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Test (durable-harness example)
        run: cd examples/durable-harness && bun test
      - name: Test (the adapter against the example)
        run: bun test bridge/mux/durable
      # The durable SDK as the npm package a program installs (M55 spec 10, ADR 0105): build it, check the tarball's
      # file list, install the tarball into a fresh project, and run one approval round trip on Node 22 and on Bun.
      # It never publishes; there is no npm token in CI.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Pack check (the SDK package)
        run: scripts/sdk-pack-check.sh

  # The browser tier (M26 spec 01), Chromium only, in TWO jobs since 2026-10-17: this one runs every
  # spec but two (`E2E_SET=rest`, `web/playwright.config.ts`), and `e2e-swap` below runs those two.
  # Measured on run 39063808818, this job took 350 to 516 s, and the two swap-server specs were its
  # critical path. Everything else in it summed to about 280 s of test time. NO `needs`: a lint failure and a browser failure
  # both have to report in one run, so this job starts beside `check` rather than behind it. It
  # installs only `web/`, because Playwright is a devDependency of `web/` and of nothing else, so
  # the root tree never grows a browser.
  #
  # WebKit is NOT here. It runs in `webkit.yml`, nightly and at a release tag: the Safari engine
  # costs a second browser download and a second pass over every spec on every push, and the bugs it
  # finds are not ones a push introduces by the hour. `E2E_WEBKIT=0` below keeps `app-phone-webkit`
  # out of the project list even though `CI` is set (`web/playwright.config.ts`).
  #
  # `release.yml` deliberately gains none of this. It carries no lint step for the same class of
  # reason (release.yml:174-176: oxlint's allocator SIGABRTs below roughly 7 GB), and an operator
  # path must never download a browser.
  e2e:
    name: browser (chromium)
    runs-on: ubuntu-latest
    env:
      E2E_WEBKIT: "0"
      E2E_SET: rest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install (web)
        run: cd web && bun install --frozen-lockfile

      # The version is READ OUT OF THE LOCKFILE, never hard-coded: `web/bunfig.toml` holds a 7-day
      # supply-chain cooldown, so which Playwright resolves is not something this file can know. A
      # bumped dependency therefore invalidates the cache on its own.
      - name: Resolve the Playwright version
        id: pw
        run: |
          version="$(grep -m1 -oE '"@playwright/test@[0-9]+\.[0-9]+\.[0-9]+"' web/bun.lock | tr -d '"' | cut -d@ -f3)"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      # Chromium plus its headless shell is ~170 MB, and the download is the slowest thing in this job
      # by an order of magnitude.
      - name: Cache Chromium
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # `--with-deps` pulls the system libraries the runner image lacks, and it is needed on a cache
      # HIT too: the cache carries the browsers under $HOME, never the apt packages.
      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: cd web && bunx playwright install --with-deps chromium
      - name: Install browser system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: cd web && bunx playwright install-deps chromium

      # `e2e` runs `vite build` first: the tier serves the SHIPPED bundle off disk, because the
      # service worker exists only in a real build.
      - name: E2E (tier 1, every spec but the swap server's)
        run: cd web && bun run e2e

      - name: Upload the failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artefacts
          path: |
            web/test-results
            web/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # The two swap-server specs of the browser tier (`E2E_SET=swap`): `service-worker.spec.ts` and
  # `update-screen.spec.ts`. They deploy a new bundle under a running browser and so share one lock,
  # which makes them serial by design: about 3.3 min alone, about 6.7 min when one flake re-ran the
  # whole chain (run 39063808818). On their own runner that chain no longer holds up the other specs.
  # Same rules as `e2e`: NO `needs`, Chromium only, WebKit stays in `webkit.yml`.
  # Wakes on a change to the service worker, the update screen, the swap server and its fixtures
  # (`swap` in scripts/test-sets.ts), and every night.
  e2e-swap:
    name: browser (swap server)
    needs: changes
    if: needs.changes.outputs.swap == 'true'
    runs-on: ubuntu-latest
    env:
      E2E_WEBKIT: "0"
      E2E_SET: swap
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install (web)
        run: cd web && bun install --frozen-lockfile

      # The version is READ OUT OF THE LOCKFILE, never hard-coded: `web/bunfig.toml` holds a 7-day
      # supply-chain cooldown, so which Playwright resolves is not something this file can know. A
      # bumped dependency therefore invalidates the cache on its own.
      - name: Resolve the Playwright version
        id: pw
        run: |
          version="$(grep -m1 -oE '"@playwright/test@[0-9]+\.[0-9]+\.[0-9]+"' web/bun.lock | tr -d '"' | cut -d@ -f3)"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      # Chromium plus its headless shell is ~170 MB, and the download is the slowest thing in this job
      # by an order of magnitude.
      - name: Cache Chromium
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # `--with-deps` pulls the system libraries the runner image lacks, and it is needed on a cache
      # HIT too: the cache carries the browsers under $HOME, never the apt packages.
      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: cd web && bunx playwright install --with-deps chromium
      - name: Install browser system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: cd web && bunx playwright install-deps chromium

      # No `vite build` here, unlike `e2e` above: these two specs serve the two bundles that
      # `e2e/serve-builds.ts` builds itself into `e2e/.builds/`, and use no other server (4173 and
      # 4175 do not start in this set). `--workers=1` because `service-worker.spec.ts` and
      # `update-screen.spec.ts` move one shared pointer behind the `holdSwapServer` lock
      # (`web/e2e/fixtures/builds.ts`) and run one case at a time anyway. More workers would only
      # open browsers that wait on that lock.
      - name: E2E (tier 1, the swap-server specs)
        run: cd web && bunx playwright test --workers=1

      - name: Upload the failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-swap-artefacts
          path: |
            web/test-results
            web/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # The quarantined tests (`*.quarantine.test.*`), and only those. NOT BLOCKING: `continue-on-error`
  # makes a red run here a green check, so a flaky test that moved to quarantine cannot stop a push or
  # a release, and the log still shows whether it passes. With no such file the job ends after the
  # file listing (about 20 s), without an install. Fix the test and give it its old name back.
  quarantine:
    name: quarantined tests (not blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Count the quarantined files
        id: files
        run: echo "count=$(git ls-files '*.quarantine.test.*' | wc -l)" >> "${GITHUB_OUTPUT}"
      - name: Install (root)
        if: steps.files.outputs.count != '0'
        run: bun install --frozen-lockfile
      - name: Install (web)
        if: steps.files.outputs.count != '0'
        run: cd web && bun install --frozen-lockfile
      - name: Test (quarantined files)
        if: steps.files.outputs.count != '0'
        run: bun scripts/test.ts --quarantine
      # No `continue-on-error` on this step: a file quarantined for more than 14 days (the date in its
      # first line) turns this job red. The job is not a required check, so a push still goes through.
      # `if: always()` so a red test run above does not hide an expired file.
      - name: Check the 14-day limit
        if: always()
        run: bun scripts/check-quarantine.ts

  # The nightly report, the same shape as the `report` job in `windows.yml`. Only a scheduled run
  # reports. A red night opens ONE issue labelled `ci-nightly` and each further red night adds a
  # comment; the first green night closes it. A cancelled run says nothing. Cost of one night: a few
  # seconds on a Linux runner, nothing repeats inside a night, and a push, PR or manual run never
  # touches the issue. `needs` names every job above, so a red job anywhere turns the night red.
  report:
    name: nightly report
    needs: [changes, check, web-tests, crew, bun-floor, durable-example, e2e, e2e-swap, quarantine]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RESULTS: ${{ join(needs.*.result, ' ') }}
      NEEDS_JSON: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ github.sha }}
    steps:
      - name: Open, update or close the issue
        run: |
          set -euo pipefail
          label="ci-nightly"
          # Any failure is red. Without one, a cancelled job says nothing about the code.
          case " ${RESULTS} " in
            *" failure "*) result="red" ;;
            *" cancelled "*)
              echo "The nightly run was cancelled; leaving the issue as it is."
              exit 0 ;;
            *) result="green" ;;
          esac
          gh label create "${label}" --repo "${REPO}" --color B60205 \
            --description "The nightly CI run is red" 2>/dev/null || true
          number="$(gh issue list --repo "${REPO}" --label "${label}" --state open --json number --jq '.[0].number // empty')"
          if [ "${result}" = "green" ]; then
            if [ -n "${number}" ]; then
              gh issue close "${number}" --repo "${REPO}" \
                --comment "The nightly CI run is green again: ${RUN_URL} (commit ${SHA:0:9})."
            fi
            exit 0
          fi
          failed="$(printf '%s' "${NEEDS_JSON}" | jq -r 'to_entries[] | select(.value.result == "failure") | .key' | paste -sd ',' - | sed 's/,/, /g')"
          body="The nightly CI run is red: ${RUN_URL} (commit ${SHA:0:9}). Failed jobs: ${failed}."
          last_green="$(gh run list --repo "${REPO}" --workflow ci.yml --event schedule --status success --limit 1 --json headSha --jq '.[0].headSha // empty')"
          if [ -n "${last_green}" ]; then
            body="${body} Commits since the last green nightly: https://github.com/${REPO}/compare/${last_green}...${SHA}"
          fi
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --repo "${REPO}" --body "${body}"
            exit 0
          fi
          gh issue create --repo "${REPO}" --label "${label}" \
            --title "The nightly CI run is red" --body "${body} This issue closes itself on the next green nightly run."
